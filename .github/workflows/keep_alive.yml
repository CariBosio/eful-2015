name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: |
          node -e '
            let baseUrl = process.env.SUPABASE_URL.replace(/\/+$/, "");
            const key = process.env.SUPABASE_ANON_KEY;
            const table = process.env.SUPABASE_TABLE;

            if (!baseUrl.includes("/rest/v1")) {
              baseUrl += "/rest/v1";
            }

            const targetUrl = `${baseUrl}/${table}?select=id&limit=1`;
            console.log("Consultando endpoint:", targetUrl);

            fetch(targetUrl, {
              method: "GET",
              headers: {
                "apikey": key,
                "Authorization": `Bearer ${key}`
              }
            })
            .then(res => {
              console.log("Supabase respondió con status:", res.status);
              if (res.status >= 200 && res.status < 400) {
                console.log("Ping exitoso. La base de datos está activa.");
                process.exit(0);
              } else {
                console.error("Respuesta no satisfactoria:", res.status);
                process.exit(1);
              }
            })
            .catch(err => {
              console.error("Error en la petición:", err.message);
              process.exit(1);
            });
          '
