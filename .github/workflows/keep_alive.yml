name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
  # Permite ejecutarlo manualmente desde GitHub Actions para probarlo
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://vjysfyldknjhqblgeiw.supabase.co/rest/v1/${{ secrets.SUPABASE_TABLE }}?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Supabase respondió con código HTTP: $STATUS"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Ping exitoso. El proyecto sigue activo."
            exit 0
          else
            echo "Error al conectar con Supabase. Código recibido: $STATUS"
            exit 1
          fi
