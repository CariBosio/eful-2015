name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        run: |
          URL="https://vjysfyldknjhqblgeiw.supabase.co/auth/v1/health"
          echo "Consultando: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Supabase respondio con codigo HTTP: $STATUS"

          if [ "$STATUS" -eq 200 ]; then
            echo "Ping exitoso. El proyecto sigue activo."
            exit 0
          else
            echo "Error al conectar con Supabase. Codigo recibido: $STATUS"
            exit 1
          fi
